<!DOCTYPE html>
<html>
<head>
    <title>CC Store - Checkout</title>
    <link rel="stylesheet" href="css/product.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/form.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>

<nav>
    <div class="brand">
        <a href="index.html" target="_parent">CC Store</a>
    </div>

    <ul class="nav-left">
        <li><a href="products.html" target="_parent">Products</a></li>
        <li><a href="cart.html" target="_parent">Cart</a></li>
    </ul>

    <input type="text" class="search-bar" placeholder="Search"
           onkeydown="if(event.key==='Enter') searchProduct()">

    <div class="menu-container">
        <div class="hamburger" onclick="toggleMenu()">☰</div>

        <div id="dropdown-menu" class="dropdown-menu">
            <a href="sign-in.html" target="_parent">Sign In</a>
            <a href="create-account.html" target="_parent">Create Account</a>
            <a href="about.html" target="_parent">About Us</a>
            <a href="contact.html" target="_parent">Contact Us</a>
            <a href="help-center.html" target="_parent">Help Center</a>
        </div>
    </div>
</nav>

<section>
    <h2 class="page-title">Checkout</h2>

    <form>
        <h3>Shipping Info</h3>

        <label>Full Name</label>
        <input type="text">

        <label>Address</label>
        <textarea rows="3"></textarea>

        <label>Contact Number</label>
        <input type="text">

        <h3 style="margin-top:20px;">Payment Method</h3>
        <br>
        
        <label>
            <input type="radio" name="pay" value="card"> Credit Card
        </label>

        <div class="payment-row">
            <div>
                <label>Card Number</label>
                <input type="text">
            </div>
            <div>
                <label>Expiration Date</label>
                <input type="text" placeholder="MM/YY">
            </div>
            <div>
                <label>CVV</label>
                <input type="text">
            </div>
        </div>

        <label style="margin-top:15px;">
            <input type="radio" name="pay" value="ewallet"> Pay With e-Wallet
        </label>

        <h3 style="margin-top:20px;">Order Summary</h3>
        <p>Item 1 x 1 - RM00.00</p>
        <p>Item 2 x 1 - RM00.00</p>
        <p style="margin-top:10px;">Subtotal: RM00.00</p>
        <p>Shipping: RM5.00</p>
        <p>Total: RM5.00</p>

        <button type="button">Place Order</button>
    </form>
</section>

<script src="js/main.js"></script>

</body>
</html>
