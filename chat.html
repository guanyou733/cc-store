<!DOCTYPE html>
<html>
<head>
    <title>Customer Service</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/chat.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    
<nav>
    <div class="brand">
        <a href="index.html" target="_parent">CC Store</a>
    </div>

    <ul class="nav-left">
        <li><a href="products.html" target="_parent">Products</a></li>
        <li><a href="cart.html" target="_parent">Cart</a></li>
    </ul>

    <input type="text" class="search-bar" placeholder="Search"
           onkeydown="if(event.key==='Enter') searchProduct()">

    <div class="menu-container">
        <div class="hamburger" onclick="toggleMenu()">☰</div>

        <div id="dropdown-menu" class="dropdown-menu">
            <a href="sign-in.html" target="_parent">Sign In</a>
            <a href="create-account.html" target="_parent">Create Account</a>
            <a href="about.html" target="_parent">About Us</a>
            <a href="contact.html" target="_parent">Contact Us</a>
            <a href="help-center.html" target="_parent">Help Center</a>
        </div>
    </div>
</nav>

<section>
    <div class="cs-panel">

        <div id="bot-view" class="cs-view">
            <div class="cs-bot-intro">
                <div class="cs-bubble">Hi! I'm your virtual assistant. How can I help you today?</div>
            </div>

            <div id="bot-thread" class="cs-thread"></div>

            <div class="cs-quick-actions">
                <button type="button" class="cs-action" data-topic="track">Track order</button>
                <button type="button" class="cs-action" data-topic="refund">Request refund</button>
                <button type="button" class="cs-action" data-topic="return">Request return</button>
            </div>

            <button type="button" id="human-btn" class="cs-human-btn">Talk to a human agent</button>

            <div class="chat-input-row hidden" id="chat-input-row">
                <input type="text" id="chat-input" placeholder="Type a message...">
                <button type="button" onclick="sendMessage()">Send</button>
            </div>
        </div>

    </div>
</section>

<script src="js/main.js"></script>

</body>
</html>
